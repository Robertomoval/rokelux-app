<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b09"><title>Validación de documento · ROKELUX</title>
<style>body{margin:0;background:#080b09;color:#f4f6f4;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#111713;border:1px solid #2b3a2c;border-radius:20px;padding:24px;box-sizing:border-box}h1{font-size:24px;margin:0 0 8px;color:#8cff00}p{line-height:1.5;color:#c3ccc4}#result{margin-top:18px;padding:16px;border-radius:12px;background:#172019}.valid{border:1px solid #72c835}.invalid{border:1px solid #c84b4b}small{color:#9fa9a1}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="card"><h1>ROKELUX</h1><p>Comprobación de autenticidad documental</p><div id="result" role="status">Verificando el código…</div><p><small>Esta página confirma únicamente tipo, fecha y autenticidad. No publica información personal del cliente.</small></p></main>
<script>
const result=document.getElementById('result'),token=new URLSearchParams(location.search).get('token');
async function verify(){if(!token||!/^[0-9a-f]{64}$/.test(token)){result.className='invalid';result.textContent='Código inválido o incompleto.';return;}try{const client=window.supabase.createClient('https://xrtiwmvvzewlglbmlufm.supabase.co','sb_publishable_8vYzQJ29K4TmG_Z2ViR1zQ_-GTg8t9F',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await client.rpc('rokelux_verify_document',{p_token:token});if(error)throw error;if(!data?.valid){result.className='invalid';result.textContent='Documento no encontrado o código revocado.';return;}result.className='valid';result.innerHTML='<b>Documento auténtico</b><br>'+data.issuer+'<br>'+data.document_type+'<br>Fecha del servicio: '+new Date(data.service_date+'T12:00:00').toLocaleDateString('es-EC')+'<br>Código: '+data.document_code;}catch{result.className='invalid';result.textContent='No se pudo comprobar ahora. Verifica tu conexión e inténtalo de nuevo.';}}
verify();
</script></body></html>
